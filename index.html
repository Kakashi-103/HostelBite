<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HostelBite</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    background: #111;

    color: white;

    padding: 10px;
}

.container {

    max-width: 450px;

    margin: auto;

    background: #181818;

    border-radius: 20px;

    overflow: hidden;
}

.header {

    background:
        linear-gradient(
            145deg,
            #7a1717,
            #4d0d0d
        );

    padding: 25px;

    text-align: center;
}

.header-icon {

    font-size: 42px;
}

.header h1 {

    margin-top: 8px;

    font-size: 27px;
}

.header p {

    color: #d9aaaa;

    margin-top: 5px;
}

.content {

    padding: 20px;
}

.section-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;
}

.meal-section {

    margin-bottom: 30px;
}

.meal-title {

    color: #d94a4a;

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 10px;
}

.food-card {

    background: #242424;

    border: 1px solid #383838;

    border-radius: 12px;

    padding: 15px;

    margin-bottom: 10px;
}

.food-name {

    font-weight: bold;

    font-size: 16px;
}

.food-price {

    color: #aaa;

    margin-top: 4px;

    font-size: 14px;
}

.quantity {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 13px;
}

.quantity button {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    border: 1px solid #7a1717;

    background: #321616;

    color: white;

    font-size: 21px;

    cursor: pointer;
}

.qty-value {

    font-size: 19px;

    font-weight: bold;
}

input {

    width: 100%;

    padding: 14px;

    margin-bottom: 15px;

    background: #242424;

    border: 1px solid #444;

    border-radius: 10px;

    color: white;

    font-size: 16px;
}

.total-box {

    background: #222;

    border-radius: 12px;

    padding: 17px;

    margin-top: 20px;
}

.total-row {

    display: flex;

    justify-content: space-between;
}

.total-price {

    color: #d94a4a;

    font-size: 21px;

    font-weight: bold;
}

.order-button {

    width: 100%;

    padding: 16px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #8b1e1e;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.admin-button {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    background: transparent;

    border: 1px solid #444;

    border-radius: 10px;

    color: #888;

    cursor: pointer;
}

.admin-panel {

    display: none;

    margin-top: 20px;

    padding: 18px;

    background: #202020;

    border-radius: 13px;
}

.admin-panel h2 {

    color: #d94a4a;

    margin-bottom: 18px;

    margin-top: 18px;
}

.admin-panel h2:first-child {

    margin-top: 0;
}

.admin-section {

    margin-bottom: 25px;
}

.admin-food {

    background: #292929;

    padding: 12px;

    border-radius: 9px;

    margin-bottom: 8px;
}

.admin-food-name {

    font-weight: bold;
}

.admin-food-price {

    color: #999;

    font-size: 13px;

    margin-top: 4px;
}

.admin-actions {

    display: flex;

    gap: 7px;

    margin-top: 9px;
}

.admin-actions button {

    flex: 1;

    padding: 8px;

    border-radius: 7px;

    border: 1px solid #444;

    background: #222;

    color: white;

    cursor: pointer;
}

.add-food {

    width: 100%;

    padding: 11px;

    border: 1px solid #7a1717;

    border-radius: 8px;

    background: #321616;

    color: #e06a6a;

    cursor: pointer;
}

.order-card {

    background: #292929;

    padding: 13px;

    border-radius: 9px;

    margin-bottom: 8px;
}

.delete-order {

    width: 100%;

    margin-top: 10px;

    padding: 9px;

    border: 1px solid #7a1717;

    border-radius: 8px;

    background: #321616;

    color: #e06a6a;

    cursor: pointer;
}

.summary {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-bottom: 18px;
}

.summary-card {

    background: #241616;

    border: 1px solid #5e1a1a;

    border-radius: 9px;

    padding: 12px;

    text-align: center;
}

.summary-number {

    color: #d94a4a;

    font-size: 22px;

    font-weight: bold;
}

.summary-label {

    color: #999;

    font-size: 11px;
}

.food-summary {

    background: #292929;

    border-radius: 12px;

    padding: 14px;

    margin-bottom: 12px;
}

.food-summary-title {

    color: #d94a4a;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;
}

.food-summary-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 9px 0;

    border-bottom: 1px solid #3a3a3a;
}

.food-summary-row:last-child {

    border-bottom: none;
}

.food-summary-name {

    color: #ddd;

    font-size: 15px;
}

.food-summary-qty {

    color: white;

    font-size: 17px;

    font-weight: bold;

    background: #321616;

    border: 1px solid #5e1a1a;

    border-radius: 8px;

    min-width: 38px;

    padding: 5px 8px;

    text-align: center;
}

.no-orders {

    color: #777;

    padding: 5px 0;

}

.close-admin {

    width: 100%;

    margin-top: 15px;

    padding: 11px;

    background: transparent;

    border: 1px solid #444;

    color: #999;

    border-radius: 8px;

    cursor: pointer;
}

</style>

</head>


<body>


<div class="container">


<div class="header">

    <div class="header-icon">
        🍱
    </div>

    <h1>
        HOSTELBITE
    </h1>

    <p>
        Your Hostel Meal Companion
    </p>

</div>


<div class="content">


<div>

    <div class="section-title">
        Place Your Order
    </div>

    <input
        id="name"
        type="text"
        placeholder="Enter your name"
    >

</div>


<div id="menu">

    Loading menu...

</div>


<div class="total-box">

    <div class="total-row">

        <span>
            TOTAL
        </span>

        <span
            class="total-price"
            id="total">

            ₹0

        </span>

    </div>

</div>


<button
    class="order-button"
    onclick="placeOrder()">

    PLACE ORDER

</button>


<button
    class="admin-button"
    onclick="openAdmin()">

    ⚙️ ADMIN

</button>


<!-- =========================
     ADMIN PANEL
========================= -->

<div
    class="admin-panel"
    id="adminPanel">


    <h2>
        🔐 ADMIN PANEL
    </h2>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <div
                class="summary-number"
                id="totalOrders">

                0

            </div>

            <div class="summary-label">

                ORDERS

            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-number"
                id="totalItems">

                0

            </div>

            <div class="summary-label">

                ITEMS

            </div>

        </div>

    </div>


    <!-- FOOD OPTIONS -->

    <h2>
        🍽️ FOOD OPTIONS
    </h2>


    <div id="adminMenu">

        Loading...

    </div>


    <!-- FOOD SUMMARY -->

    <h2>
        📦 FOOD SUMMARY
    </h2>


    <div id="foodSummary">

        Loading...

    </div>


    <!-- INDIVIDUAL ORDERS -->

    <h2>
        📊 TODAY'S ORDERS
    </h2>


    <div id="adminOrders">

        Loading...

    </div>


    <button
        onclick="loadData()"
        style="
            width:100%;
            padding:11px;
            background:#242424;
            border:1px solid #444;
            color:white;
            border-radius:8px;
            margin-top:10px;
            cursor:pointer;
        ">

        🔄 REFRESH

    </button>


    <button
        class="close-admin"
        onclick="closeAdmin()">

        CLOSE ADMIN

    </button>


</div>


</div>

</div>


<script>


/* =================================
   GOOGLE APPS SCRIPT URL
================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzPkRPBboQMzbHS0Eq2NpDCBEUpiOmDY1wBxaPdovqR7vrXTlHjPQ24pTFA_NgxOqWa/exec";


/* =================================
   DATA
================================= */

let menu = [];

let orders = [];

let quantities = {};


/* =================================
   LOAD DATA
================================= */

function loadData() {

    fetch(
        SCRIPT_URL +
        "?t=" +
        Date.now()
    )

    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to connect to server."
                );

            }

            return response.json();

        }
    )

    .then(
        data => {

            menu =
                Array.isArray(data.menu)
                ? data.menu
                : [];


            orders =
                Array.isArray(data.orders)
                ? data.orders
                : [];


            renderMenu();

            renderAdmin();

            calculateTotal();

        }
    )

    .catch(
        error => {

            console.error(error);


            const menuElement =
                document.getElementById(
                    "menu"
                );


            if (menuElement) {

                menuElement.innerHTML =

                    "<p style='color:#888'>" +

                    "Unable to load menu." +

                    "</p>";

            }

        }
    );

}


/* =================================
   CUSTOMER MENU
================================= */

function renderMenu() {

    const container =
        document.getElementById(
            "menu"
        );


    if (!container) {
        return;
    }


    if (menu.length === 0) {

        container.innerHTML =

            "<p style='color:#888'>" +

            "No food options available." +

            "</p>";

        return;

    }


    const meals = [
        "Lunch",
        "Dinner"
    ];


    let html = "";


    meals.forEach(
        meal => {

            const items =
                menu.filter(
                    item =>
                        String(item.meal)
                        .toLowerCase()
                        ===
                        meal.toLowerCase()
                );


            if (items.length === 0) {
                return;
            }


            html += `

                <div class="meal-section">

                    <div class="meal-title">

                        ${
                            meal === "Lunch"
                            ? "☀️"
                            : "🌙"
                        }

                        ${meal}

                    </div>

            `;


            items.forEach(
                item => {

                    if (
                        quantities[item.id]
                        === undefined
                    ) {

                        quantities[item.id] = 0;

                    }


                    html += `

                        <div class="food-card">

                            <div class="food-name">

                                ${escapeHTML(
                                    item.food
                                )}

                            </div>


                            <div class="food-price">

                                ₹${Number(
                                    item.price
                                ) || 0}

                            </div>


                            <div class="quantity">

                                <button
                                    onclick="
                                        changeQty(
                                            '${escapeAttribute(item.id)}',
                                            -1
                                        )
                                    ">

                                    −

                                </button>


                                <div
                                    class="qty-value"
                                    id="qty-${escapeAttribute(
                                        item.id
                                    )}">

                                    ${
                                        quantities[
                                            item.id
                                        ]
                                    }

                                </div>


                                <button
                                    onclick="
                                        changeQty(
                                            '${escapeAttribute(item.id)}',
                                            1
                                        )
                                    ">

                                    +

                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            html += "</div>";

        }
    );


    container.innerHTML = html;

}


/* =================================
   CHANGE QUANTITY
================================= */

function changeQty(
    id,
    amount
) {

    if (
        quantities[id] === undefined
    ) {

        quantities[id] = 0;

    }


    quantities[id] += amount;


    if (
        quantities[id] < 0
    ) {

        quantities[id] = 0;

    }


    const element =
        document.getElementById(
            "qty-" + id
        );


    if (element) {

        element.innerText =
            quantities[id];

    }


    calculateTotal();

}


/* =================================
   CALCULATE TOTAL
================================= */

function calculateTotal() {

    let total = 0;


    menu.forEach(
        item => {

            const qty =
                Number(
                    quantities[item.id]
                ) || 0;


            total +=
                qty *
                (
                    Number(
                        item.price
                    ) || 0
                );

        }
    );


    const totalElement =
        document.getElementById(
            "total"
        );


    if (totalElement) {

        totalElement.innerText =
            "₹" + total;

    }

}


/* =================================
   PLACE ORDER
================================= */

function placeOrder() {

    const nameElement =
        document.getElementById(
            "name"
        );


    const name =
        nameElement.value.trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;

    }


    const selectedItems = [];

    let total = 0;


    menu.forEach(
        item => {

            const qty =
                Number(
                    quantities[item.id]
                ) || 0;


            if (qty > 0) {

                selectedItems.push({

                    food:
                        String(
                            item.food || ""
                        ),

                    meal:
                        String(
                            item.meal || ""
                        ),

                    quantity:
                        qty,

                    price:
                        Number(
                            item.price
                        ) || 0

                });


                total +=
                    qty *
                    (
                        Number(
                            item.price
                        ) || 0
                    );

            }

        }
    );


    if (
        selectedItems.length === 0
    ) {

        alert(
            "Please select at least one item."
        );

        return;

    }


    const meals = [
        ...new Set(
            selectedItems.map(
                item => item.meal
            )
        )
    ];


    const meal =
        meals.join(" + ");


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "order"
    );


    data.append(
        "name",
        name
    );


    data.append(
        "meal",
        meal
    );


    data.append(
        "items",
        JSON.stringify(
            selectedItems
        )
    );


    data.append(
        "total",
        total
    );


    fetch(
        SCRIPT_URL,
        {
            method: "POST",
            body: data
        }
    )
    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    "Order failed."
                );

            }

        }
    )
    .then(
        () => {

            alert(
                "✓ Order received!"
            );

            nameElement.value = "";

            quantities = {};

            renderMenu();

            calculateTotal();

        }
    )
    .catch(
        error => {

            console.error(error);

            alert(
                "Order could not be submitted. Please try again."
            );

        }
    );

}


/* =================================
   ADMIN LOGIN
================================= */

function openAdmin() {

    const pin =
        prompt(
            "Enter Admin PIN:"
        );


    if (
        pin !== "1721"
    ) {

        alert(
            "Incorrect Admin PIN."
        );

        return;

    }


    document
        .getElementById(
            "adminPanel"
        )
        .style.display =
        "block";


    loadData();

}


/* =================================
   CLOSE ADMIN
================================= */

function closeAdmin() {

    document
        .getElementById(
            "adminPanel"
        )
        .style.display =
        "none";

}


/* =================================
   ADMIN MENU
================================= */

function renderAdmin() {

    const container =
        document.getElementById(
            "adminMenu"
        );


    if (!container) {
        return;
    }


    let html = "";


    [
        "Lunch",
        "Dinner"
    ]
    .forEach(
        meal => {

            html += `

                <div class="admin-section">

                    <h3>

                        ${
                            meal === "Lunch"
                            ? "☀️"
                            : "🌙"
                        }

                        ${meal}

                    </h3>

            `;


            const items =
                menu.filter(
                    item =>
                        String(item.meal)
                        .toLowerCase()
                        ===
                        meal.toLowerCase()
                );


            if (
                items.length === 0
            ) {

                html += `

                    <p
                        style="
                        color:#777;
                        margin:10px 0;
                        ">

                        No food items added.

                    </p>

                `;

            }


            items.forEach(
                item => {

                    html += `

                        <div class="admin-food">

                            <div class="admin-food-name">

                                ${escapeHTML(
                                    item.food
                                )}

                            </div>


                            <div class="admin-food-price">

                                ₹${Number(
                                    item.price
                                ) || 0}

                            </div>


                            <div class="admin-actions">

                                <button
                                    onclick="
                                        editFood(
                                            '${escapeAttribute(item.id)}'
                                        )
                                    ">

                                    ✏️ EDIT

                                </button>


                                <button
                                    onclick="
                                        deleteFood(
                                            '${escapeAttribute(item.id)}'
                                        )
                                    ">

                                    🗑️ DELETE

                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                <button
                    class="add-food"
                    onclick="
                        addFood('${meal}')
                    ">

                    + ADD FOOD ITEM

                </button>

            `;


            html += "</div>";

        }
    );


    container.innerHTML = html;


    renderOrders();

    updateSummary();

}


/* =================================
   ADD FOOD
================================= */

function addFood(meal) {

    const food =
        prompt(
            "Food name:"
        );


    if (!food) {
        return;
    }


    const price =
        prompt(
            "Price:"
        );


    if (
        price === null ||
        price === ""
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "addFood"
    );


    data.append(
        "meal",
        meal
    );


    data.append(
        "food",
        food
    );


    data.append(
        "price",
        price
    );


    fetch(
        SCRIPT_URL,
        {
            method: "POST",
            body: data
        }
    )
    .then(
        () => {

            alert(
                "✓ Food item added."
            );

            loadData();

        }
    )
    .catch(
        error => {

            console.error(error);

            alert(
                "Unable to add food item."
            );

        }
    );

}


/* =================================
   EDIT FOOD
================================= */

function editFood(id) {

    const item =
        menu.find(
            x =>
                String(x.id)
                ===
                String(id)
        );


    if (!item) {
        return;
    }


    const food =
        prompt(
            "Food name:",
            item.food
        );


    if (!food) {
        return;
    }


    const price =
        prompt(
            "Price:",
            item.price
        );


    if (
        price === null ||
        price === ""
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "updateFood"
    );


    data.append(
        "id",
        id
    );


    data.append(
        "meal",
        item.meal
    );


    data.append(
        "food",
        food
    );


    data.append(
        "price",
        price
    );


    fetch(
        SCRIPT_URL,
        {
            method: "POST",
            body: data
        }
    )
    .then(
        () => {

            alert(
                "✓ Food item updated."
            );

            loadData();

        }
    )
    .catch(
        error => {

            console.error(error);

            alert(
                "Unable to update food item."
            );

        }
    );

}


/* =================================
   DELETE FOOD
================================= */

function deleteFood(id) {

    const item =
        menu.find(
            x =>
                String(x.id)
                ===
                String(id)
        );


    if (!item) {
        return;
    }


    if (
        !confirm(
            "Delete " +
            item.food +
            "?"
        )
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "deleteFood"
    );


    data.append(
        "id",
        id
    );


    fetch(
        SCRIPT_URL,
        {
            method: "POST",
            body: data
        }
    )
    .then(
        () => {

            alert(
                "✓ Food item deleted."
            );

            loadData();

        }
    )
    .catch(
        error => {

            console.error(error);

            alert(
                "Unable to delete food item."
            );

        }
    );

}


/* =================================
   NORMALIZE ORDER ITEMS
================================= */

function getOrderItems(order) {

    if (!order) {
        return [];
    }


    let items =
        order.items;


    /*
       If Apps Script already returned
       an array, use it.
    */

    if (
        Array.isArray(items)
    ) {

        return items;

    }


    /*
       If items came as JSON text,
       convert it into an array.
    */

    if (
        typeof items === "string"
    ) {

        try {

            const parsed =
                JSON.parse(items);


            if (
                Array.isArray(parsed)
            ) {

                return parsed;

            }

        }
        catch (error) {

            console.warn(
                "Could not parse order items:",
                items
            );

        }

    }


    return [];

}


/* =================================
   ADMIN ORDERS
================================= */

function renderOrders() {

    const container =
        document.getElementById(
            "adminOrders"
        );


    if (!container) {
        return;
    }


    if (
        orders.length === 0
    ) {

        container.innerHTML =
            "<div class='no-orders'>" +
            "No orders today." +
            "</div>";

        return;

    }


    let html = "";


    orders.forEach(
        order => {

            const items =
                getOrderItems(
                    order
                );


            html += `

                <div class="order-card">

                    <strong>

                        👤
                        ${escapeHTML(
                            order.name || ""
                        )}

                    </strong>


                    <div
                        style="
                        color:#aaa;
                        margin-top:5px;
                        ">

                        ${escapeHTML(
                            order.meal || ""
                        )}

                    </div>

            `;


            items.forEach(
                item => {

                    html += `

                        <div
                            style="
                            margin-top:5px;
                            color:#ddd;
                            ">

                            •
                            ${escapeHTML(
                                item.food || ""
                            )}

                            ×

                            ${
                                Number(
                                    item.quantity
                                ) || 0
                            }

                        </div>

                    `;

                }
            );


            html += `

                    <div
                        style="
                        margin-top:7px;
                        color:#d94a4a;
                        font-weight:bold;
                        ">

                        ₹${
                            Number(
                                order.total
                            ) || 0
                        }

                    </div>


                    <button
                        class="delete-order"
                        onclick="
                            deleteOrder(
                                ${Number(order.row) || 0}
                            )
                        ">

                        🗑️ DELETE ORDER

                    </button>

                </div>

            `;

        }
    );


    container.innerHTML = html;

}


/* =================================
   ADMIN SUMMARY
   ITEM-WISE LUNCH / DINNER
================================= */

function updateSummary() {

    let itemCount = 0;


    const foodSummary = {

        Lunch: {},

        Dinner: {}

    };


    orders.forEach(
        order => {

            const items =
                getOrderItems(
                    order
                );


            items.forEach(
                item => {

                    const quantity =
                        Number(
                            item.quantity
                        ) || 0;


                    itemCount +=
                        quantity;


                    let meal =
                        String(
                            item.meal ||
                            ""
                        ).trim();


                    /*
                       Some older orders may not
                       have meal inside each item.
                    */

                    if (
                        meal !== "Lunch" &&
                        meal !== "Dinner"
                    ) {

                        const orderMeal =
                            String(
                                order.meal ||
                                ""
                            );


                        if (
                            orderMeal
                            .includes(
                                "Lunch"
                            )
                        ) {

                            meal = "Lunch";

                        }
                        else if (
                            orderMeal
                            .includes(
                                "Dinner"
                            )
                        ) {

                            meal = "Dinner";

                        }
                    }


                    if (
                        meal !== "Lunch" &&
                        meal !== "Dinner"
                    ) {

                        return;

                    }


                    const food =
                        String(
                            item.food ||
                            "Unknown Item"
                        ).trim();


                    if (
                        !foodSummary[meal][food]
                    ) {

                        foodSummary[meal][food] =
                            0;

                    }


                    foodSummary[meal][food] +=
                        quantity;

                }
            );

        }
    );


    const totalOrders =
        document.getElementById(
            "totalOrders"
        );


    const totalItems =
        document.getElementById(
            "totalItems"
        );


    if (totalOrders) {

        totalOrders.innerText =
            orders.length;

    }


    if (totalItems) {

        totalItems.innerText =
            itemCount;

    }


    renderFoodSummary(
        foodSummary
    );

}


/* =================================
   RENDER FOOD SUMMARY
================================= */

function renderFoodSummary(
    summary
) {

    const container =
        document.getElementById(
            "foodSummary"
        );


    if (!container) {
        return;
    }


    let html = "";


    [
        "Lunch",
        "Dinner"
    ]
    .forEach(
        meal => {

            const foods =
                summary[meal] || {};


            const foodNames =
                Object.keys(
                    foods
                );


            html += `

                <div class="food-summary">

                    <div class="food-summary-title">

                        ${
                            meal === "Lunch"
                            ? "☀️"
                            : "🌙"
                        }

                        ${meal}

                    </div>

            `;


            if (
                foodNames.length === 0
            ) {

                html += `

                    <div class="no-orders">

                        No orders

                    </div>

                `;

            }
            else {

                foodNames
                    .sort()
                    .forEach(
                        food => {

                            html += `

                                <div
                                    class="food-summary-row">

                                    <div
                                        class="food-summary-name">

                                        ${escapeHTML(
                                            food
                                        )}

                                    </div>


                                    <div
                                        class="food-summary-qty">

                                        ${
                                            foods[
                                                food
                                            ]
                                        }

                                    </div>

                                </div>

                            `;

                        }
                    );

            }


            html += `

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =================================
   DELETE ORDER
================================= */

function deleteOrder(row) {

    if (
        !row ||
        Number(row) < 2
    ) {

        alert(
            "Invalid order."
        );

        return;

    }


    if (
        !confirm(
            "Delete this order?"
        )
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "deleteOrder"
    );


    data.append(
        "row",
        row
    );


    fetch(
        SCRIPT_URL,
        {
            method: "POST",
            body: data
        }
    )
    .then(
        () => {

            alert(
                "✓ Order deleted."
            );

            loadData();

        }
    )
    .catch(
        error => {

            console.error(error);

            alert(
                "Unable to delete order."
            );

        }
    );

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            text ?? ""
        );


    return div.innerHTML;

}


/* =================================
   ESCAPE ATTRIBUTE
================================= */

function escapeAttribute(
    text
) {

    return String(
        text ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =================================
   START
================================= */

loadData();

</script>
