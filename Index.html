<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HostelBite</title>


<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


body {

    font-family:
        Arial,
        sans-serif;

    background: #111;

    color: white;

    padding: 10px;

}


.container {

    max-width: 450px;

    margin: auto;

    background: #181818;

    border-radius: 20px;

    overflow: hidden;

}


.header {

    background:
        linear-gradient(
            145deg,
            #7a1717,
            #4d0d0d
        );

    padding: 25px;

    text-align: center;

}


.header-icon {

    font-size: 42px;

}


.header h1 {

    margin-top: 8px;

    font-size: 27px;

}


.header p {

    color: #d9aaaa;

    margin-top: 5px;

}


.content {

    padding: 20px;

}


.section-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;

}


.meal-section {

    margin-bottom: 30px;

}


.meal-title {

    color: #d94a4a;

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 10px;

}


.food-card {

    background: #242424;

    border: 1px solid #383838;

    border-radius: 12px;

    padding: 15px;

    margin-bottom: 10px;

}


.food-name {

    font-weight: bold;

    font-size: 16px;

}


.food-price {

    color: #aaa;

    margin-top: 4px;

    font-size: 14px;

}


.quantity {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 13px;

}


.quantity button {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    border: 1px solid #7a1717;

    background: #321616;

    color: white;

    font-size: 21px;

}


.qty-value {

    font-size: 19px;

    font-weight: bold;

}


input {

    width: 100%;

    padding: 14px;

    margin-bottom: 15px;

    background: #242424;

    border: 1px solid #444;

    border-radius: 10px;

    color: white;

    font-size: 16px;

}


.total-box {

    background: #222;

    border-radius: 12px;

    padding: 17px;

    margin-top: 20px;

}


.total-row {

    display: flex;

    justify-content: space-between;

}


.total-price {

    color: #d94a4a;

    font-size: 21px;

    font-weight: bold;

}


.order-button {

    width: 100%;

    padding: 16px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #8b1e1e;

    color: white;

    font-size: 17px;

    font-weight: bold;

}


.admin-button {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    background: transparent;

    border: 1px solid #444;

    border-radius: 10px;

    color: #888;

}


.admin-panel {

    display: none;

    margin-top: 20px;

    padding: 18px;

    background: #202020;

    border-radius: 13px;

}


.admin-panel h2 {

    color: #d94a4a;

    margin-bottom: 18px;

}


.admin-section {

    margin-bottom: 25px;

}


.admin-food {

    background: #292929;

    padding: 12px;

    border-radius: 9px;

    margin-bottom: 8px;

}


.admin-food-name {

    font-weight: bold;

}


.admin-food-price {

    color: #999;

    font-size: 13px;

}


.admin-actions {

    display: flex;

    gap: 7px;

    margin-top: 9px;

}


.admin-actions button {

    flex: 1;

    padding: 8px;

    border-radius: 7px;

    border: 1px solid #444;

    background: #222;

    color: white;

}


.add-food {

    width: 100%;

    padding: 11px;

    border: 1px solid #7a1717;

    border-radius: 8px;

    background: #321616;

    color: #e06a6a;

}


.order-card {

    background: #292929;

    padding: 13px;

    border-radius: 9px;

    margin-bottom: 8px;

}


.delete-order {

    width: 100%;

    margin-top: 10px;

    padding: 9px;

    border: 1px solid #7a1717;

    border-radius: 8px;

    background: #321616;

    color: #e06a6a;

}


.summary {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-bottom: 18px;

}


.summary-card {

    background: #241616;

    border: 1px solid #5e1a1a;

    border-radius: 9px;

    padding: 12px;

    text-align: center;

}


.summary-number {

    color: #d94a4a;

    font-size: 22px;

    font-weight: bold;

}


.summary-label {

    color: #999;

    font-size: 11px;

}


.admin-input {

    margin-top: 7px;

}


.close-admin {

    width: 100%;

    margin-top: 15px;

    padding: 11px;

    background: transparent;

    border: 1px solid #444;

    color: #999;

    border-radius: 8px;

}

</style>

</head>


<body>


<div class="container">


<div class="header">

    <div class="header-icon">

        🍱

    </div>

    <h1>

        HOSTELBITE

    </h1>

    <p>

        Your Hostel Meal Companion

    </p>

</div>


<div class="content">


<div>

    <div class="section-title">

        Place Your Order

    </div>


    <input

        id="name"

        type="text"

        placeholder="Enter your name"

    >

</div>


<div id="menu">

    Loading menu...

</div>


<div class="total-box">

    <div class="total-row">

        <span>

            TOTAL

        </span>

        <span
            class="total-price"
            id="total">

            ₹0

        </span>

    </div>

</div>


<button

    class="order-button"

    onclick="placeOrder()">

    PLACE ORDER

</button>


<button

    class="admin-button"

    onclick="openAdmin()">

    ⚙️ ADMIN

</button>


<div
    class="admin-panel"
    id="adminPanel">


    <h2>

        🔐 ADMIN PANEL

    </h2>


    <div class="summary">

        <div class="summary-card">

            <div
                class="summary-number"
                id="totalOrders">

                0

            </div>

            <div class="summary-label">

                ORDERS

            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-number"
                id="totalItems">

                0

            </div>

            <div class="summary-label">

                ITEMS

            </div>

        </div>

    </div>


    <h2>

        🍽️ FOOD OPTIONS

    </h2>


    <div id="adminMenu">

        Loading...

    </div>


    <h2>

        📊 TODAY'S ORDERS

    </h2>


    <div id="adminOrders">

        Loading...

    </div>


    <button

        onclick="loadData()"

        style="
            width:100%;
            padding:11px;
            background:#242424;
            border:1px solid #444;
            color:white;
            border-radius:8px;
            margin-top:10px;
        ">

        🔄 REFRESH

    </button>


    <button

        class="close-admin"

        onclick="closeAdmin()">

        CLOSE ADMIN

    </button>


</div>


</div>

</div>


<script>


/* =================================
   YOUR GOOGLE APPS SCRIPT URL
================================= */

const SCRIPT_URL =

"https://script.google.com/macros/s/AKfycbzPkRPBboQMzbHS0Eq2NpDCBEUpiOmDY1wBxaPdovqR7vrXTlHjPQ24pTFA_NgxOqWa/exec";


/* =================================
   DATA
================================= */

let menu = [];

let orders = [];

let quantities = {};


/* =================================
   LOAD
================================= */

function loadData() {

    fetch(
        SCRIPT_URL +
        "?t=" +
        Date.now()
    )

    .then(
        response =>
            response.json()
    )

    .then(
        data => {

            menu =
                data.menu || [];

            orders =
                data.orders || [];


            renderMenu();

            renderAdmin();

            calculateTotal();

        }
    )

    .catch(
        error => {

            console.error(error);

            document
                .getElementById(
                    "menu"
                )
                .innerHTML =
                "Unable to load menu.";

        }
    );

}


/* =================================
   CUSTOMER MENU
================================= */

function renderMenu() {

    const container =
        document
            .getElementById(
                "menu"
            );


    if (menu.length === 0) {

        container.innerHTML =

            "<p style='color:#888'>" +

            "No food options available." +

            "</p>";

        return;

    }


    const meals = [
        "Lunch",
        "Dinner"
    ];


    let html = "";


    meals.forEach(
        meal => {

            const items =
                menu.filter(
                    item =>
                        item.meal === meal
                );


            if (items.length === 0)
                return;


            html += `

                <div
                    class="meal-section">

                    <div
                        class="meal-title">

                        ${
                            meal === "Lunch"
                            ? "☀️"
                            : "🌙"
                        }

                        ${meal}

                    </div>

            `;


            items.forEach(
                item => {

                    if (
                        quantities[item.id]
                        === undefined
                    ) {

                        quantities[item.id] = 0;

                    }


                    html += `

                        <div
                            class="food-card">

                            <div
                                class="food-name">

                                ${escapeHTML(
                                    item.food
                                )}

                            </div>


                            <div
                                class="food-price">

                                ₹${item.price}

                            </div>


                            <div
                                class="quantity">

                                <button
                                    onclick=
                                    "changeQty(
                                        '${item.id}',
                                        -1
                                    )">

                                    −

                                </button>


                                <div
                                    class="qty-value"
                                    id=
                                    "qty-${item.id}">

                                    ${
                                        quantities[
                                            item.id
                                        ]
                                    }

                                </div>


                                <button
                                    onclick=
                                    "changeQty(
                                        '${item.id}',
                                        1
                                    )">

                                    +

                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            html += "</div>";

        }
    );


    container.innerHTML = html;

}


/* =================================
   QUANTITY
================================= */

function changeQty(
    id,
    amount
) {

    if (
        quantities[id] === undefined
    ) {

        quantities[id] = 0;

    }


    quantities[id] += amount;


    if (quantities[id] < 0) {

        quantities[id] = 0;

    }


    const element =
        document
            .getElementById(
                "qty-" + id
            );


    if (element) {

        element.innerText =
            quantities[id];

    }


    calculateTotal();

}


/* =================================
   TOTAL
================================= */

function calculateTotal() {

    let total = 0;


    menu.forEach(
        item => {

            const qty =
                quantities[item.id] || 0;


            total +=
                qty *
                Number(item.price);

        }
    );


    document
        .getElementById(
            "total"
        )
        .innerText =
        "₹" + total;

}


/* =================================
   PLACE ORDER
================================= */

function placeOrder() {

    const name =
        document
            .getElementById(
                "name"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;

    }


    const selectedItems =
        [];


    let total = 0;


    menu.forEach(
        item => {

            const qty =
                quantities[item.id] || 0;


            if (qty > 0) {

                selectedItems.push({

                    food: item.food,

                    meal: item.meal,

                    quantity: qty,

                    price: item.price

                });


                total +=
                    qty *
                    Number(item.price);

            }

        }
    );


    if (
        selectedItems.length === 0
    ) {

        alert(
            "Please select at least one item."
        );

        return;

    }


    const meals =
        [
            ...new Set(
                selectedItems.map(
                    item => item.meal
                )
            )
        ];


    const meal =
        meals.join(" + ");


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "order"
    );


    data.append(
        "name",
        name
    );


    data.append(
        "meal",
        meal
    );


    data.append(
        "items",
        JSON.stringify(
            selectedItems
        )
    );


    data.append(
        "total",
        total
    );


    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: data

        }

    );


    alert(
        "✓ Order received!"
    );


    document
        .getElementById(
            "name"
        )
        .value = "";


    quantities = {};


    renderMenu();

    calculateTotal();

}


/* =================================
   ADMIN LOGIN
================================= */

function openAdmin() {

    const pin =
        prompt(
            "Enter Admin PIN:"
        );


    if (
        pin !== "1234"
    ) {

        alert(
            "Incorrect Admin PIN."
        );

        return;

    }


    document
        .getElementById(
            "adminPanel"
        )
        .style.display =
        "block";


    loadData();

}


/* =================================
   CLOSE ADMIN
================================= */

function closeAdmin() {

    document
        .getElementById(
            "adminPanel"
        )
        .style.display =
        "none";

}


/* =================================
   ADMIN MENU
================================= */

function renderAdmin() {

    const container =
        document
            .getElementById(
                "adminMenu"
            );


    let html = "";


    [
        "Lunch",
        "Dinner"
    ]
    .forEach(
        meal => {

            html += `

                <div
                    class="admin-section">

                    <h3>

                        ${
                            meal === "Lunch"
                            ? "☀️"
                            : "🌙"
                        }

                        ${meal}

                    </h3>

            `;


            const items =
                menu.filter(
                    item =>
                        item.meal === meal
                );


            if (
                items.length === 0
            ) {

                html += `

                    <p
                        style="
                        color:#777;
                        margin:10px 0;
                        ">

                        No food items added.

                    </p>

                `;

            }


            items.forEach(
                item => {

                    html += `

                        <div
                            class="admin-food">

                            <div
                                class=
                                "admin-food-name">

                                ${escapeHTML(
                                    item.food
                                )}

                            </div>


                            <div
                                class=
                                "admin-food-price">

                                ₹${item.price}

                            </div>


                            <div
                                class=
                                "admin-actions">

                                <button

                                    onclick=
                                    "editFood(
                                        '${item.id}'
                                    )">

                                    ✏️ EDIT

                                </button>


                                <button

                                    onclick=
                                    "deleteFood(
                                        '${item.id}'
                                    )">

                                    🗑️ DELETE

                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                    <button

                        class="add-food"

                        onclick=
                        "addFood('${meal}')">

                        + ADD FOOD ITEM

                    </button>

                </div>

            `;

        }
    );


    container.innerHTML = html;

}


/* =================================
   ADD FOOD
================================= */

function addFood(meal) {

    const food =
        prompt(
            "Food name:"
        );


    if (!food) return;


    const price =
        prompt(
            "Price:"
        );


    if (
        price === null ||
        price === ""
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "addFood"
    );


    data.append(
        "meal",
        meal
    );


    data.append(
        "food",
        food
    );


    data.append(
        "price",
        price
    );


    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: data

        }

    )

    .then(
        () => {

            alert(
                "✓ Food item added."
            );

            loadData();

        }
    );

}


/* =================================
   EDIT FOOD
================================= */

function editFood(id) {

    const item =
        menu.find(
            x => x.id === id
        );


    if (!item) return;


    const food =
        prompt(
            "Food name:",
            item.food
        );


    if (!food) return;


    const price =
        prompt(
            "Price:",
            item.price
        );


    if (
        price === null ||
        price === ""
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "updateFood"
    );


    data.append(
        "id",
        id
    );


    data.append(
        "meal",
        item.meal
    );


    data.append(
        "food",
        food
    );


    data.append(
        "price",
        price
    );


    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: data

        }

    )

    .then(
        () => {

            alert(
                "✓ Food item updated."
            );

            loadData();

        }
    );

}


/* =================================
   DELETE FOOD
================================= */

function deleteFood(id) {

    const item =
        menu.find(
            x => x.id === id
        );


    if (!item) return;


    if (
        !confirm(
            "Delete " +
            item.food +
            "?"
        )
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "deleteFood"
    );


    data.append(
        "id",
        id
    );


    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: data

        }

    )

    .then(
        () => {

            alert(
                "✓ Food item deleted."
            );

            loadData();

        }
    );

}


/* =================================
   ADMIN ORDERS
================================= */

function renderOrders() {

    const container =
        document
            .getElementById(
                "adminOrders"
            );


    if (
        orders.length === 0
    ) {

        container.innerHTML =
            "No orders today.";

        return;

    }


    let html = "";


    orders.forEach(
        order => {

            html += `

                <div
                    class="order-card">

                    <strong>

                        👤
                        ${escapeHTML(
                            order.name
                        )}

                    </strong>


                    <div
                        style="
                        color:#aaa;
                        margin-top:5px;
                        ">

                        ${escapeHTML(
                            order.meal
                        )}

                    </div>

            `;


            order.items.forEach(
                item => {

                    html += `

                        <div
                            style="
                            margin-top:5px;
                            color:#ddd;
                            ">

                            •
                            ${escapeHTML(
                                item.food
                            )}

                            ×

                            ${item.quantity}

                        </div>

                    `;

                }
            );


            html += `

                    <div
                        style="
                        margin-top:7px;
                        color:#d94a4a;
                        font-weight:bold;
                        ">

                        ₹${order.total}

                    </div>


                    <button

                        class="delete-order"

                        onclick=
                        "deleteOrder(
                            ${order.row}
                        )">

                        🗑️ DELETE ORDER

                    </button>

                </div>

            `;

        }
    );


    container.innerHTML = html;

}


/* =================================
   ADMIN SUMMARY
================================= */

function updateSummary() {

    let itemCount = 0;


    orders.forEach(
        order => {

            order.items.forEach(
                item => {

                    itemCount +=
                        Number(
                            item.quantity
                        ) || 0;

                }
            );

        }
    );


    document
        .getElementById(
            "totalOrders"
        )
        .innerText =
        orders.length;


    document
        .getElementById(
            "totalItems"
        )
        .innerText =
        itemCount;

}


/* =================================
   DELETE ORDER
================================= */

function deleteOrder(row) {

    if (
        !confirm(
            "Delete this order?"
        )
    ) {

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "action",
        "deleteOrder"
    );


    data.append(
        "row",
        row
    );


    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: data

        }

    )

    .then(
        () => {

            alert(
                "✓ Order deleted."
            );

            loadData();

        }
    );

}


/* =================================
   ADMIN RENDER
================================= */

function renderAdmin() {

    const container =
        document
            .getElementById(
                "adminMenu"
            );


    let html = "";


    [
        "Lunch",
        "Dinner"
    ]
    .forEach(
        meal => {

            html += `

                <div
                    class="admin-section">

                    <h3>

                        ${
                            meal === "Lunch"
                            ? "☀️"
                            : "🌙"
                        }

                        ${meal}

                    </h3>

            `;


            const items =
                menu.filter(
                    item =>
                        item.meal === meal
                );


            if (
                items.length === 0
            ) {

                html += `

                    <p
                        style="
                        color:#777;
                        margin:10px 0;
                        ">

                        No food items added.

                    </p>

                `;

            }


            items.forEach(
                item => {

                    html += `

                        <div
                            class="admin-food">

                            <div
                                class=
                                "admin-food-name">

                                ${escapeHTML(
                                    item.food
                                )}

                            </div>


                            <div
                                class=
                                "admin-food-price">

                                ₹${item.price}

                            </div>


                            <div
                                class=
                                "admin-actions">

                                <button
                                    onclick=
                                    "editFood(
                                    '${item.id}'
                                    )">

                                    ✏️ EDIT

                                </button>


                                <button
                                    onclick=
                                    "deleteFood(
                                    '${item.id}'
                                    )">

                                    🗑️ DELETE

                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                <button

                    class="add-food"

                    onclick=
                    "addFood('${meal}')">

                    + ADD FOOD ITEM

                </button>

            `;


            html += "</div>";

        }
    );


    container.innerHTML = html;


    renderOrders();

    updateSummary();

}


/* =================================
   SECURITY HELPER
================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;
